<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Fast, even for a chain of stores</title><desc id="d">Store list (1,500 open cases): before 243 ms, now 1.3 ms, ≈ 190× faster; Archive (2,000 closed cases): before 5.7 s, now 1.5 ms, ≈ 3,800× faster; This week’s stats (store with 40k cases): before 2 min 7 s, now 14 ms, ≈ 9,000× faster</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--bg1)"/><stop offset="1" stop-color="var(--bg2)"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="var(--shadow)"/></filter>
</defs>
<style>
  svg { --bg1:#eef4ff; --bg2:#f6f0ff; --card:#ffffff; --tile:#f8fafc; --line:#e2e8f0; --ink:#0f172a; --ink2:#334155; --ink3:#64748b;
        --accent:#2563eb; --accentSoft:#dbeafe; --wa:#15803d; --waSoft:#dcfce7; --red:#dc2626; --redSoft:#fee2e2;
        --green:#15803d; --greenSoft:#dcfce7; --violet:#7c3aed; --violetSoft:#ede9fe; --amber:#b45309; --amberSoft:#fef3c7;
        --sky:#0369a1; --skySoft:#e0f2fe; --teal:#0f766e; --tealSoft:#ccfbf1; --shadow:rgba(30,41,90,.16); --onAccent:#ffffff; }
  @media (prefers-color-scheme: dark) {
    svg { --bg1:#0b1220; --bg2:#161b30; --card:#111827; --tile:#0f172a; --line:#273244; --ink:#f1f5f9; --ink2:#cbd5e1; --ink3:#94a3b8;
          --accent:#60a5fa; --accentSoft:#1e3a8a; --wa:#4ade80; --waSoft:#14532d; --red:#f87171; --redSoft:#4c1d1d;
          --green:#4ade80; --greenSoft:#14532d; --violet:#a78bfa; --violetSoft:#3b2a6b; --amber:#fbbf24; --amberSoft:#4a3510;
          --sky:#7dd3fc; --skySoft:#0c3a5a; --teal:#5eead4; --tealSoft:#134e4a; --shadow:rgba(0,0,0,.45); --onAccent:#0b1220; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  .ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ink { fill: var(--ink); } .ink2 { fill: var(--ink2); } .ink3 { fill: var(--ink3); } .accent { fill: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .tile { animation: up .7s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .after { animation: fade .5s ease-out both; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    .badge { transform-box: fill-box; transform-origin: right center; animation: badge .5s cubic-bezier(.2,.9,.3,1.4) both; }
    @keyframes badge { from { opacity: 0; transform: scale(.7) } to { opacity: 1; transform: none } }</style>
<rect width="1200" height="340" rx="24" fill="url(#bg)"/>

  <text x="50" y="62" class="ink" font-size="26" font-weight="800">Fast, even for a chain of stores</text>
  <text x="50" y="90" class="ink3" font-size="15.5">Server time before and after the access-rules rework · company with 70k cases</text>
  <g transform="translate(50 116)"><g class="tile" style="animation-delay:0.00s">
      <rect width="352" height="180" rx="16" fill="var(--card)" stroke="var(--line)"/>
      <text x="22" y="38" class="ink" font-size="17" font-weight="700">Store list</text>
      <text x="22" y="58" class="ink3" font-size="13">1,500 open cases</text>
      <text x="22" y="112" class="ink" font-size="44" font-weight="800" letter-spacing="-.5"><tspan class="after" style="animation-delay:0.60s">1.3 ms</tspan></text>
      <text x="22" y="146" class="ink3" font-size="15">before <tspan font-weight="600" text-decoration="line-through">243 ms</tspan></text>
      <g transform="translate(330 132)"><g class="badge" style="animation-delay:0.90s">
        <rect x="-80.4" y="0" width="80.4" height="28" rx="14" style="fill:var(--greenSoft)"/>
        <g transform="translate(-74.4 6) scale(0.6666666666666666)" class="ic " style="color:var(--green)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></g>
        <text x="-10" y="19" text-anchor="end" font-size="13.5" font-weight="700" style="fill:var(--green)">≈ 190×</text>
      </g></g>
    </g></g><g transform="translate(426 116)"><g class="tile" style="animation-delay:0.12s">
      <rect width="352" height="180" rx="16" fill="var(--card)" stroke="var(--line)"/>
      <text x="22" y="38" class="ink" font-size="17" font-weight="700">Archive</text>
      <text x="22" y="58" class="ink3" font-size="13">2,000 closed cases</text>
      <text x="22" y="112" class="ink" font-size="44" font-weight="800" letter-spacing="-.5"><tspan class="after" style="animation-delay:0.72s">1.5 ms</tspan></text>
      <text x="22" y="146" class="ink3" font-size="15">before <tspan font-weight="600" text-decoration="line-through">5.7 s</tspan></text>
      <g transform="translate(330 132)"><g class="badge" style="animation-delay:1.02s">
        <rect x="-97.2" y="0" width="97.2" height="28" rx="14" style="fill:var(--greenSoft)"/>
        <g transform="translate(-91.2 6) scale(0.6666666666666666)" class="ic " style="color:var(--green)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></g>
        <text x="-10" y="19" text-anchor="end" font-size="13.5" font-weight="700" style="fill:var(--green)">≈ 3,800×</text>
      </g></g>
    </g></g><g transform="translate(802 116)"><g class="tile" style="animation-delay:0.24s">
      <rect width="352" height="180" rx="16" fill="var(--card)" stroke="var(--line)"/>
      <text x="22" y="38" class="ink" font-size="17" font-weight="700">This week’s stats</text>
      <text x="22" y="58" class="ink3" font-size="13">store with 40k cases</text>
      <text x="22" y="112" class="ink" font-size="44" font-weight="800" letter-spacing="-.5"><tspan class="after" style="animation-delay:0.84s">14 ms</tspan></text>
      <text x="22" y="146" class="ink3" font-size="15">before <tspan font-weight="600" text-decoration="line-through">2 min 7 s</tspan></text>
      <g transform="translate(330 132)"><g class="badge" style="animation-delay:1.14s">
        <rect x="-97.2" y="0" width="97.2" height="28" rx="14" style="fill:var(--greenSoft)"/>
        <g transform="translate(-91.2 6) scale(0.6666666666666666)" class="ic " style="color:var(--green)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></g>
        <text x="-10" y="19" text-anchor="end" font-size="13.5" font-weight="700" style="fill:var(--green)">≈ 9,000×</text>
      </g></g>
    </g></g>
</svg>
