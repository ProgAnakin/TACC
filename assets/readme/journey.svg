<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">From the counter to the after-sale call</title><desc id="d">The customer comes in; a case is created in seconds; the app plans the follow-ups; the message is ready in the client’s language; the case is closed and a check-in is scheduled.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--bg1)"/><stop offset="1" stop-color="var(--bg2)"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="var(--shadow)"/></filter>
</defs>
<style>
  svg { --bg1:#eef4ff; --bg2:#f6f0ff; --card:#ffffff; --tile:#f8fafc; --line:#e2e8f0; --ink:#0f172a; --ink2:#334155; --ink3:#64748b;
        --accent:#2563eb; --accentSoft:#dbeafe; --wa:#15803d; --waSoft:#dcfce7; --red:#dc2626; --redSoft:#fee2e2;
        --green:#15803d; --greenSoft:#dcfce7; --violet:#7c3aed; --violetSoft:#ede9fe; --amber:#b45309; --amberSoft:#fef3c7;
        --sky:#0369a1; --skySoft:#e0f2fe; --teal:#0f766e; --tealSoft:#ccfbf1; --shadow:rgba(30,41,90,.16); --onAccent:#ffffff; }
  @media (prefers-color-scheme: dark) {
    svg { --bg1:#0b1220; --bg2:#161b30; --card:#111827; --tile:#0f172a; --line:#273244; --ink:#f1f5f9; --ink2:#cbd5e1; --ink3:#94a3b8;
          --accent:#60a5fa; --accentSoft:#1e3a8a; --wa:#4ade80; --waSoft:#14532d; --red:#f87171; --redSoft:#4c1d1d;
          --green:#4ade80; --greenSoft:#14532d; --violet:#a78bfa; --violetSoft:#3b2a6b; --amber:#fbbf24; --amberSoft:#4a3510;
          --sky:#7dd3fc; --skySoft:#0c3a5a; --teal:#5eead4; --tealSoft:#134e4a; --shadow:rgba(0,0,0,.45); --onAccent:#0b1220; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
  .ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ink { fill: var(--ink); } .ink2 { fill: var(--ink2); } .ink3 { fill: var(--ink3); } .accent { fill: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .track { stroke: var(--line); stroke-width: 4; stroke-linecap: round; }
    .progress { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 940; animation: fill 9s linear infinite; }
    @keyframes fill { 0% { stroke-dashoffset: 940 } 62% { stroke-dashoffset: 0 } 88% { stroke-dashoffset: 0; opacity: 1 } 96%, 100% { stroke-dashoffset: 0; opacity: 0 } }
    .dot { animation: travel 9s linear infinite; }
    @keyframes travel { 0% { transform: translateX(0); opacity: 1; animation-timing-function: linear } 62% { transform: translateX(940px); opacity: 1 } 70%, 100% { transform: translateX(940px); opacity: 0 } }
    .disc { fill: var(--card); stroke: var(--line); stroke-width: 2; }
    .glyph { color: var(--ink3); }
    .node { transform-box: fill-box; transform-origin: center; animation: lit 9s ease-out infinite both; }
    .node .disc { animation: disc 9s ease-out infinite both; animation-delay: inherit; }
    .node .glyph { animation: glyph 9s ease-out infinite both; animation-delay: inherit; }
    @keyframes lit { 0% { transform: scale(1) } 3% { transform: scale(1.12) } 7% { transform: scale(1) } 100% { transform: scale(1) } }
    @keyframes disc { 0% { fill: var(--card); stroke: var(--line) } 3%, 80% { fill: var(--accentSoft); stroke: var(--accent) } 90%, 100% { fill: var(--card); stroke: var(--line) } }
    @keyframes glyph { 0% { color: var(--ink3) } 3%, 80% { color: var(--accent) } 90%, 100% { color: var(--ink3) } }
    .done .disc { animation-name: discDone; } .done .glyph { animation-name: glyphDone; }
    @keyframes discDone { 0% { fill: var(--card); stroke: var(--line) } 3%, 80% { fill: var(--greenSoft); stroke: var(--green) } 90%, 100% { fill: var(--card); stroke: var(--line) } }
    @keyframes glyphDone { 0% { color: var(--ink3) } 3%, 80% { color: var(--green) } 90%, 100% { color: var(--ink3) } }</style>
<rect width="1200" height="330" rx="24" fill="url(#bg)"/>

  <text x="48" y="58" class="ink" font-size="24" font-weight="800">From the counter to the after-sale call</text>
  <text x="48" y="84" class="ink3" font-size="15">How a case moves through Caderninho</text>
  <line x1="130" y1="160" x2="1070" y2="160" class="track"/>
  <line x1="130" y1="160" x2="1070" y2="160" class="progress"/>
  <g transform="translate(130 160)"><g class="dot"><circle r="13" fill="var(--accent)" opacity=".18"/><circle r="6.5" fill="var(--accent)"/></g></g>
  
    <g transform="translate(130 160)">
      <g class="node" style="animation-delay:0.00s">
        <circle r="36" class="disc"/>
        <g transform="translate(-13 -13) scale(1.0833333333333333)" class="ic glyph" ><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></g>
      </g>
      <text y="70" text-anchor="middle" class="ink" font-size="17" font-weight="700">The customer comes in</text>
      <text y="94" text-anchor="middle" class="ink3" font-size="14">Special order, repair,</text><text y="113" text-anchor="middle" class="ink3" font-size="14">interest or complaint</text>
    </g>
    <g transform="translate(365 160)">
      <g class="node" style="animation-delay:1.40s">
        <circle r="36" class="disc"/>
        <g transform="translate(-13 -13) scale(1.0833333333333333)" class="ic glyph" ><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 14h6"/><path d="M12 17v-6"/></g>
      </g>
      <text y="70" text-anchor="middle" class="ink" font-size="17" font-weight="700">A case in seconds</text>
      <text y="94" text-anchor="middle" class="ink3" font-size="14">Type, ready template,</text><text y="113" text-anchor="middle" class="ink3" font-size="14">name and phone</text>
    </g>
    <g transform="translate(600 160)">
      <g class="node" style="animation-delay:2.79s">
        <circle r="36" class="disc"/>
        <g transform="translate(-13 -13) scale(1.0833333333333333)" class="ic glyph" ><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M4 2C2.8 3.7 2 5.7 2 8"/><path d="M22 8c0-2.3-.8-4.3-2-6"/></g>
      </g>
      <text y="70" text-anchor="middle" class="ink" font-size="17" font-weight="700">The app remembers</text>
      <text y="94" text-anchor="middle" class="ink3" font-size="14">Automatic follow-ups</text><text y="113" text-anchor="middle" class="ink3" font-size="14">at the best time</text>
    </g>
    <g transform="translate(835 160)">
      <g class="node" style="animation-delay:4.18s">
        <circle r="36" class="disc"/>
        <g transform="translate(-13 -13) scale(1.0833333333333333)" class="ic glyph" ><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></g>
      </g>
      <text y="70" text-anchor="middle" class="ink" font-size="17" font-weight="700">Message ready</text>
      <text y="94" text-anchor="middle" class="ink3" font-size="14">In the client’s language,</text><text y="113" text-anchor="middle" class="ink3" font-size="14">logged in the history</text>
    </g>
    <g transform="translate(1070 160)">
      <g class="node done" style="animation-delay:5.58s">
        <circle r="36" class="disc"/>
        <g transform="translate(-13 -13) scale(1.0833333333333333)" class="ic glyph" ><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
      </g>
      <text y="70" text-anchor="middle" class="ink" font-size="17" font-weight="700">Case closed</text>
      <text y="94" text-anchor="middle" class="ink3" font-size="14">Sale, pickup or solution,</text><text y="113" text-anchor="middle" class="ink3" font-size="14">check-in 7 days later</text>
    </g>
</svg>
